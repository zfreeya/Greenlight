[package]
name = "greenlight"
version = "0.1.0"
description = "Greenlight - AI 导演工作台"
authors = ["harness"]
edition = "2021"

[lib]
name = "greenlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
libc = "0.2"
